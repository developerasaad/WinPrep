name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build and unit test
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify dependencies
        run: go mod verify

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet (linux)
        run: go vet ./...

      # The windows-tagged sources (internal/windows, app_windows, the
      # integration tests) are invisible to a linux vet run, so they are
      # vetted through a cross-compile vet pass here.
      - name: go vet (windows target)
        run: GOOS=windows GOARCH=amd64 go vet ./...

      - name: Unit tests (race)
        run: go test -race -count=1 ./...

      - name: Build (linux)
        run: go build ./...

      - name: Cross-compile for Windows
        run: |
          mkdir -p dist
          GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "-s -w" -o dist/winprep.exe ./cmd/winprep
          file dist/winprep.exe

      - name: Upload the Windows executable
        uses: actions/upload-artifact@v7
        with:
          name: winprep-windows-amd64
          path: dist/winprep.exe
          if-no-files-found: error

  windows:
    name: Windows tests and smoke run
    runs-on: windows-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build winprep.exe
        run: |
          go build -trimpath -o winprep.exe ./cmd/winprep
          .\winprep.exe version

      # One pass over the whole tree: the unit tests (fakes only) plus the
      # integration tests in tests/windows, which run against the real
      # installation - registry reads, token inspection, process listing, and
      # end-to-end runs of the built executable. WINPREP_EXE is set so the
      # smoke tests use the exe built above instead of compiling their own.
      # All of it is read-only: none of it invokes Sysprep or modifies system
      # state, and the smoke tests skip themselves if the machine reports a
      # confirmed Audit Mode session.
      - name: Tests (unit and integration)
        env:
          WINPREP_EXE: ${{ github.workspace }}\winprep.exe
        run: go test -count=1 -v ./...

      - name: Publish environment details on failure
        if: failure()
        run: |
          go env
          [System.Environment]::OSVersion.VersionString
        shell: pwsh
